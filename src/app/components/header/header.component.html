<header class="header" [class.header--open]="menuOpen">
  <div class="header__bar">
    <div class="header__brand" routerLink="/home" (click)="closeMenu()">
      <span class="header__dot"></span>
      <span>Catálogo Utensilios</span>
    </div>

    <button
      type="button"
      class="header__toggle"
      [attr.aria-expanded]="menuOpen"
      aria-controls="header-panel"
      aria-label="Abrir navegación"
      (click)="toggleMenu()">
      <span class="header__toggle-bar"></span>
      <span class="header__toggle-bar"></span>
      <span class="header__toggle-bar"></span>
    </button>
  </div>

  <div class="header__panel" id="header-panel" [class.header__panel--open]="menuOpen">
    <nav class="header__nav">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
        Home
      </a>

      <a *ngIf="!auth.isLoggedIn()" routerLink="/login" routerLinkActive="active" (click)="closeMenu()">
        Login
      </a>

      <a *ngIf="auth.isLoggedIn()" routerLink="/catalogo" routerLinkActive="active" (click)="closeMenu()">
        Catálogo
      </a>

      <a *ngIf="auth.isLoggedIn()" routerLink="/registro" routerLinkActive="active" (click)="closeMenu()">
        Registro
      </a>

      <a *ngIf="auth.isLoggedIn()" routerLink="/prospeccion" routerLinkActive="active" (click)="closeMenu()">
        Prospección
      </a>

      <a *ngIf="auth.isLoggedIn() && auth.hasRole('admin')" routerLink="/administrar" routerLinkActive="active" (click)="closeMenu()">
        Administrar
      </a>
    </nav>

    <div class="header__actions">
      <span class="header__user" *ngIf="auth.currentUser() as user">
        {{ user.nombre }}
      </span>

      <button *ngIf="auth.isLoggedIn()" type="button" (click)="logout()">
        Cerrar sesión
      </button>
    </div>
  </div>

  <div class="header__backdrop" *ngIf="menuOpen" (click)="closeMenu()"></div>
</header>
